# NVIDIA Driver Package Build for Synology DSM
# 이 워크플로우는 GitHub Actions에서 Synology pkgscripts-ng 툴킷을 사용해
# NVIDIA 드라이버 커널 모듈과 사용자 공간 라이브러리·펌웨어를 DSM용 .spk 패키지로 생성합니다.

name: Build NVIDIA Driver Package for Synology DSM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version'
        required: true
        default: '1.0.0'
      nvidia_version:
        description: 'NVIDIA Driver version'
        required: true
        default: '535.261.03'

jobs:
  build-nvidia-package:
    name: Build NVIDIA Driver Package
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: ['kvmx64']
        dsm: ['7.2']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3 \
            python3-pip \
            bc \
            libssl-dev \
            ncurses-dev \
            curl \
            wget \
            cifs-utils \
            kmod \
            libc6-i386 \
            tree

      - name: Create toolkit directory structure
        run: |
          sudo mkdir -p /toolkit
          cd /toolkit
          sudo git clone https://github.com/SynologyOpenSource/pkgscripts-ng
          cd pkgscripts-ng
          sudo git checkout DSM${{ matrix.dsm }}

      - name: Deploy Synology build environment
        run: |
          cd /toolkit/pkgscripts-ng
          sudo ./EnvDeploy -v ${{ matrix.dsm }} -p ${{ matrix.arch }}

      - name: Download Synology GPL kernel source and toolchain
        run: |
          set -e
          case "${{ matrix.dsm }}" in
            "7.0") BUILD_NUM="41890" ;;
            "7.1") BUILD_NUM="42962" ;;
            "7.2") BUILD_NUM="72806" ;;
          esac
          case "${{ matrix.arch }}" in
            "kvmx64") KERNEL_VER="4.4.x" ;;
            *) KERNEL_VER="4.4.x" ;;
          esac
          cd /tmp
          wget "https://global.download.synology.com/download/ToolChain/Synology%20NAS%20GPL%20Source/${{ matrix.dsm }}-${BUILD_NUM}/${{ matrix.arch }}/linux-${KERNEL_VER}.txz"
          sudo mkdir -p "/toolkit/build_env/ds.${{ matrix.arch }}-${{ matrix.dsm }}/source/kernel"
          sudo tar -xf "linux-${KERNEL_VER}.txz" -C "/toolkit/build_env/ds.${{ matrix.arch }}-${{ matrix.dsm }}/source/kernel" --strip-components=1

      - name: Cache NVIDIA open-source kernel modules
        uses: actions/cache@v4
        id: cache-nvidia-modules
        with:
          path: /tmp/nvidia-open-modules
          key: nvidia-modules-${{ github.event.inputs.nvidia_version || '535.261.03' }}-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            nvidia-modules-${{ github.event.inputs.nvidia_version || '535.261.03' }}-${{ runner.os }}-
            nvidia-modules-${{ github.event.inputs.nvidia_version || '535.261.03' }}-

      - name: Download NVIDIA open-source kernel modules
        if: steps.cache-nvidia-modules.outputs.cache-hit != 'true'
        run: |
          set -e
          cd /tmp
          NVIDIA_VER="${{ github.event.inputs.nvidia_version || '535.261.03' }}"
          git clone \
            --depth 1 \
            --single-branch \
            --branch ${NVIDIA_VER} \
            https://github.com/NVIDIA/open-gpu-kernel-modules.git \
            nvidia-open-modules

      - name: Verify NVIDIA modules availability
        run: |
          if [ "${{ steps.cache-nvidia-modules.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Used cached NVIDIA modules"
          else
            echo "🔄 Fresh modules downloaded"
          fi
          find /tmp/nvidia-open-modules -name "Makefile" | head -5

      - name: Copy NVIDIA kernel modules to package source
        run: |
          sudo mkdir -p "/toolkit/source/nvidia-driver"
          sudo cp -r /tmp/nvidia-open-modules/* "/toolkit/source/nvidia-driver/"

      # --- 추가: 사용자 공간 라이브러리와 펌웨어 추출 및 복사 ---
      - name: Download NVIDIA official driver installer
        run: |
          cd /tmp
          wget -O NVIDIA-driver.run "https://us.download.nvidia.com/XFree86/Linux-x86_64/${{ github.event.inputs.nvidia_version }}/NVIDIA-Linux-x86_64-${{ github.event.inputs.nvidia_version }}.run"
          chmod +x NVIDIA-driver.run

      - name: Extract libraries and firmware from .run
        run: |
          mkdir -p /tmp/nvidia-extract
          cd /tmp/nvidia-extract
          ../NVIDIA-driver.run --extract-only

      - name: Copy user-space libraries into package source
        run: |
          # 라이브러리
          sudo mkdir -p /toolkit/source/nvidia-driver/lib
          sudo cp -v /tmp/nvidia-extract/usr/lib/libnvidia-*.so* /toolkit/source/nvidia-driver/lib/
          sudo cp -v /tmp/nvidia-extract/usr/lib/libcuda.so* /toolkit/source/nvidia-driver/lib/

          # Video Codec SDK 라이브러리
          sudo cp -v /tmp/nvidia-extract/usr/lib/libnvidia-encode.so* /toolkit/source/nvidia-driver/lib/
          sudo cp -v /tmp/nvidia-extract/usr/lib/libnvcuvid.so* /toolkit/source/nvidia-driver/lib/

      - name: Copy firmware binaries into package source
        run: |
          sudo mkdir -p /toolkit/source/nvidia-driver/firmware
          sudo cp -v /tmp/nvidia-extract/lib/firmware/nvidia/*.bin /toolkit/source/nvidia-driver/firmware/

      # --- 기존 INFO.sh 및 스크립트 준비 ---
      - name: Create NVIDIA package source structure (INFO FILE)
        run: |
          set -e
          cd /toolkit/source/nvidia-driver
          sudo tee ./INFO.sh << 'EOF'
          #!/bin/bash
          set -e
          if [ -f /pkgscripts-ng/include/pkg_util.sh ]; then
            source /pkgscripts-ng/include/pkg_util.sh
          else
            source /pkgscripts/include/pkg_util.sh 2>/dev/null || true
          fi
          package="nvidia-driver"
          version="${{ github.event.inputs.version || '1.0.0' }}"
          displayname="NVIDIA GPU Driver"
          description="NVIDIA GPU Driver for Synology DSM ${{ matrix.dsm }}"
          arch="x86_64"
          maintainer="PeterSuh-Q3"
          distributor="PeterSuh-Q3"
          os_min_ver="7.0-40337"
          os_max_ver="7.2-99999"
          # 추가된 폴더 구조 반영
          files="
            lib/libnvidia-*.so*
            lib/libcuda.so*
            lib/libnvidia-encode.so*
            lib/libnvcuvid.so*
            firmware/*.bin
            lib/modules/drivers/nvidia/*.ko
            etc/modprobe.d/nvidia.conf
          "
          if [ "${BASH_SOURCE[0]}" = "$0" ]; then
            if type pkg_dump_info &>/dev/null; then
              pkg_dump_info
            fi
          fi
          EOF
          sudo chmod +x INFO.sh

      - name: Copy modprobe config
        run: |
          sudo mkdir -p /toolkit/source/nvidia-driver/etc/modprobe.d
          sudo tee /toolkit/source/nvidia-driver/etc/modprobe.d/nvidia.conf << 'EOF'
          # NVIDIA driver modules
          alias char-major-195* nvidia
          options nvidia NVreg_DeviceFileUID=0 NVreg_DeviceFileGID=0 NVreg_DeviceFileMode=0666
          EOF

      - name: Prepare SynoBuildConf scripts
        run: sudo chmod +x /toolkit/source/nvidia-driver/SynoBuildConf/*

      - name: Build NVIDIA package
        run: |
          set -e
          cd /toolkit/pkgscripts-ng
          sudo ./PkgCreate.py -p ${{ matrix.arch }} -v ${{ matrix.dsm }} -c nvidia-driver || {
            echo "=== Build failed - diagnostics ==="
            sudo cat /toolkit/logs/error.build || true
            exit 1
          }

      - name: Rename and prepare packages
        run: |
          set -e
          cd /toolkit/result_spk
          for spk_dir in */; do
            cd "$spk_dir"
            for f in *.spk; do
              sudo mv "$f" "${f%.spk}-${{ matrix.arch }}-${{ matrix.dsm }}.spk"
            done
            cd ..
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-driver-${{ matrix.arch }}-${{ matrix.dsm }}
          path: /toolkit/result_spk/*/*.spk

      - name: Release packages
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            /toolkit/result_spk/*/*.spk
