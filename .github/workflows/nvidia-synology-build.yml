# NVIDIA Driver Package Build for Synology DSM
# 이 워크플로우는 GitHub Actions에서 Synology pkgscripts-ng 툴킷을 사용해
# NVIDIA 드라이버 커널 모듈을 DSM용으로 크로스 컴파일하여 .spk 패키지로 생성합니다.

name: Build NVIDIA Driver Package for Synology DSM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version'
        required: true
        default: '1.0.0'
      nvidia_version:
        description: 'NVIDIA Driver version'  
        required: true
        default: '535.261.03'

jobs:
  build-nvidia-package:
    name: Build NVIDIA Driver Package
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: ['kvmx64']
        dsm: ['7.2']
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3 \
            python3-pip \
            bc \
            libssl-dev \
            ncurses-dev \
            curl \
            wget \
            cifs-utils \
            kmod \
            libc6-i386

      # 캐시 복원/저장
      - name: Cache Synology toolkit and build environment
        uses: actions/cache@v4
        id: cache-synology-env
        with:
          path: |
            /toolkit/pkgscripts-ng
            /toolkit/build_env
            /toolkit/toolkit_tarballs
          key: synology-toolkit-${{ matrix.dsm }}-${{ matrix.arch }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            synology-toolkit-${{ matrix.dsm }}-${{ matrix.arch }}-
            synology-toolkit-${{ matrix.dsm }}-

      # 캐시 미스 시에만 실행
      - name: Create toolkit directory structure
        if: steps.cache-synology-env.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /toolkit
          cd /toolkit
          sudo git clone https://github.com/SynologyOpenSource/pkgscripts-ng
          cd pkgscripts-ng
          sudo git checkout DSM${{ matrix.dsm }}
          
      - name: Deploy Synology build environment
        if: steps.cache-synology-env.outputs.cache-hit != 'true'
        run: |
          cd /toolkit/pkgscripts-ng
          sudo ./EnvDeploy -v ${{ matrix.dsm }} -p ${{ matrix.arch }}
          ls -l /toolkit/pkgscripts-ng

      # 캐시 적중 확인
      - name: Verify build environment
        run: |
          echo "Build environment status:"
          if [ "${{ steps.cache-synology-env.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Used cached environment"
          else
            echo "🔄 Fresh environment deployed"
          fi
          ls -la /toolkit/
          ls -la /toolkit/build_env/ds.${{ matrix.arch }}-${{ matrix.dsm }}/

      - name: Download Synology GPL kernel source and toolchain
        run: |
          # DSM 버전에 맞는 Synology 아카이브에서 GPL 소스와 툴체인 다운로드
          case "${{ matrix.dsm }}" in
            "7.0")
              BUILD_NUM="41890"
              ;;
            "7.1") 
              BUILD_NUM="42962"
              ;;
            "7.2")
              BUILD_NUM="72806"
              ;;
          esac
          
          # 플랫폼별 커널 버전 매핑
          case "${{ matrix.arch }}" in
            "kvmx64")
              KERNEL_VER="4.4.x"
              ;;
            *)
              KERNEL_VER="4.4.x"
              ;;
          esac
          
          # GPL 커널 소스 다운로드
          cd /tmp
          wget "https://global.download.synology.com/download/ToolChain/Synology%20NAS%20GPL%20Source/${{ matrix.dsm }}-${BUILD_NUM}/${{ matrix.arch }}/linux-${KERNEL_VER}.txz"
          
          # chroot 환경에 커널 소스 배치
          sudo mkdir -p "/toolkit/build_env/ds.${{ matrix.arch }}-${{ matrix.dsm }}/source/kernel"
          sudo tar -xf "linux-${KERNEL_VER}.txz" -C "/toolkit/build_env/ds.${{ matrix.arch }}-${{ matrix.dsm }}/source/kernel" --strip-components=1


      - name: Cache NVIDIA open-source kernel modules
        uses: actions/cache@v4
        id: cache-nvidia-modules
        with:
          path: /tmp/nvidia-open-modules
          key: nvidia-modules-${{ github.event.inputs.nvidia_version || '535.261.03' }}-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            nvidia-modules-${{ github.event.inputs.nvidia_version || '535.261.03' }}-${{ runner.os }}-
            nvidia-modules-${{ github.event.inputs.nvidia_version || '535.261.03' }}-
      
      - name: Download NVIDIA open-source kernel modules
        if: steps.cache-nvidia-modules.outputs.cache-hit != 'true'
        run: |
          set -e
          cd /tmp
          
          NVIDIA_VER="${{ github.event.inputs.nvidia_version || '535.261.03' }}"
          echo "Downloading NVIDIA modules version: ${NVIDIA_VER}"
          
          git clone \
            --depth 1 \
            --single-branch \
            --branch ${NVIDIA_VER} \
            https://github.com/NVIDIA/open-gpu-kernel-modules.git \
            nvidia-open-modules || \
          git clone \
            --depth 1 \
            --single-branch \
            https://github.com/NVIDIA/open-gpu-kernel-modules.git \
            nvidia-open-modules
            
          echo "Repository downloaded successfully"
          ls -la nvidia-open-modules/
      
      - name: Verify NVIDIA modules availability
        run: |
          if [ "${{ steps.cache-nvidia-modules.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Used cached NVIDIA modules"
          else
            echo "🔄 Fresh modules downloaded"
          fi
          
          echo "NVIDIA modules ready:"
          find /tmp/nvidia-open-modules -name "Makefile" | head -5
      
      - name: Copy NVIDIA modules to package source
        run: |
          sudo mkdir -p "/toolkit/source/nvidia-driver"
          sudo cp -r /tmp/nvidia-open-modules/* "/toolkit/source/nvidia-driver/"
          echo "NVIDIA modules copied to package source"
          
      - name: Create NVIDIA package source structure
        run: |
          # INFO.sh 생성
          cd /toolkit/source/nvidia-driver

          sudo tee /toolkit/source/nvidia-driver/INFO.sh << 'EOF'          
          #!/bin/bash
          source /toolkit/pkgscripts-ng/include/pkg_util.sh
          
          package="nvidia-driver"
          version="${{ github.event.inputs.version || '1.0.0' }}"
          os_min_ver="${{ matrix.dsm }}.0-40000"
          displayname="NVIDIA GPU Driver"
          description="NVIDIA GPU Driver for Synology DSM ${{ matrix.dsm }}"
          arch="$(pkg_get_unified_platform)"
          maintainer="Community Package"
          
          # 의존성 정의
          pkg_dump_info
          EOF
          
          sudo chmod +x /toolkit/source/nvidia-driver/INFO.sh
          
      - name: Create SynoBuildConf directory and scripts
        run: |
          cd "/toolkit/source/nvidia-driver"
          
          # SynoBuildConf 디렉토리 생성
          sudo mkdir -p /toolkit/source/nvidia-driver/SynoBuildConf
          
          # depends 파일 생성
          sudo tee /toolkit/source/nvidia-driver/SynoBuildConf/depends << 'EOF'
          [BuildDependent]
          
          [ReferenceOnly]
          
          [default]
          all="${{ matrix.dsm }}.2"
          EOF
          
          # build 스크립트 생성 - NVIDIA 커널 모듈 컴파일
          sudo tee /toolkit/source/nvidia-driver/SynoBuildConf/build << 'EOF'
          #!/bin/bash
          set -e
          
          echo "=== Building NVIDIA open-source kernel modules ==="
          
          # chroot 내부 경로 (빌드 스크립트는 chroot에서 실행됨)
          KERNEL_SRC="/source/kernel"
          NVIDIA_SRC="/source/nvidia-driver"
          
          # 현재 작업 디렉터리 확인
          echo "Current directory: $(pwd)"
          echo "Available directories:"
          ls -la /source/
          
          # 커널 소스 확인
          if [ ! -d "${KERNEL_SRC}" ]; then
              echo "ERROR: Kernel source not found at ${KERNEL_SRC}"
              ls -la /source/
              exit 1
          fi
          
          # 커널 헤더 준비
          cd ${KERNEL_SRC}
          echo "Preparing kernel headers..."
          ls -la
          
          # Synology 커널 설정 적용
          if [ -f .config ]; then
              echo "Using existing kernel config"
          else
              echo "Creating default config"
              make defconfig
          fi

          make olddefconfig
          make modules_prepare
          export IGNORE_MISSING_MODULE_SYMVERS=1  # Only if absolutely necessary

          make scripts
          [ -f Module.symvers ] || touch Module.symvers
          
          # NVIDIA 오픈소스 모듈 빌드
          cd ${NVIDIA_SRC}
          echo "NVIDIA source contents:"
          ls -la
          
          # 오픈소스 모듈은 루트에서 직접 make modules
          echo "Building NVIDIA open-source kernel modules..."
          
          export KERNEL_UNAME=$(cd ${KERNEL_SRC} && make kernelversion)
          export SYSSRC="${KERNEL_SRC}"
          export SYSOUT="${KERNEL_SRC}"
          
          # 오픈소스 모듈 빌드
          make modules \
              KERNEL_UNAME=${KERNEL_UNAME} \
              SYSSRC=${KERNEL_SRC} \
              SYSOUT=${KERNEL_SRC} \
              -j$(nproc) || {
              echo "ERROR: Module build failed"
              echo "Kernel source check:"
              ls -la ${KERNEL_SRC}/
              echo "NVIDIA source check:"
              ls -la ${NVIDIA_SRC}/
              exit 1
          }
          
          echo "=== Build complete. Generated modules:"
          find . -name "*.ko" -type f
          
          EOF

      - name: Create Install Script
        run: |
          
          # install 스크립트 생성 - .spk 패키지 생성
          sudo tee /toolkit/source/nvidia-driver/SynoBuildConf/install << 'EOF'
          #!/bin/bash
          
          set -e
          
          echo "=== Creating NVIDIA driver package ==="
          
          # 패키지 작업 디렉토리
          PKG_DIR=/tmp/_nvidia_spk
          rm -rf $PKG_DIR
          mkdir -p $PKG_DIR
          
          # pkg_util.sh 로드
          source /toolkit/pkgscripts-ng/include/pkg_util.sh
          
          # 내부 tarball 생성 함수
          create_inner_tarball() {
              local inner_tarball_dir=/tmp/_inner_tarball
              rm -rf $inner_tarball_dir && mkdir -p $inner_tarball_dir
              
              # 모듈 설치 디렉토리 생성
              mkdir -p $inner_tarball_dir/lib/modules/drivers/nvidia
              mkdir -p $inner_tarball_dir/usr/bin
              mkdir -p $inner_tarball_dir/etc/modprobe.d

              # 컴파일된 커널 모듈들 복사
              if [ -d "/source/nvidia-driver" ]; then
                  find /source/nvidia-driver -name "*.ko" -exec cp {} $inner_tarball_dir/lib/modules/drivers/nvidia/ \;
              fi
              
              # modprobe 설정 파일 생성
              cat > $inner_tarball_dir/etc/modprobe.d/nvidia.conf << 'MODPROBE_EOF'
          # NVIDIA driver modules
          alias char-major-195* nvidia
          options nvidia NVreg_DeviceFileUID=0 NVreg_DeviceFileGID=0 NVreg_DeviceFileMode=0666
          MODPROBE_EOF
              
              # package.tgz 생성
              pkg_make_package $inner_tarball_dir "${PKG_DIR}"
          }
          
          # SPK 생성 함수
          create_spk() {
              local scripts_dir=$PKG_DIR/scripts
              
              # 스크립트 디렉토리 생성
              mkdir -p $scripts_dir
              
              # 패키지 아이콘 복사 (기본 아이콘 생성)
              # 64x64 PNG 아이콘 필요
              if [ ! -f PACKAGE_ICON.PNG ]; then
                  # 기본 아이콘 생성 (실제로는 nvidia 로고 등을 사용)
                  echo "Creating default package icon..."
                  # 여기서는 빈 PNG 파일 생성 (실제 구현시 적절한 아이콘 필요)
                  touch PACKAGE_ICON.PNG
              fi
              cp -av PACKAGE_ICON*.PNG $PKG_DIR/ 2>/dev/null || true
              
              # INFO 파일 생성
              /source/nvidia-driver/INFO.sh > "$PKG_DIR/INFO"
              
              # 패키지 스크립트들 생성
              
              # start-stop-status 스크립트
              cat > $scripts_dir/start-stop-status << 'SCRIPT_EOF'
          #!/bin/sh
          
          case $1 in
              start)
                  # 모듈 로드
                  echo "Loading NVIDIA kernel modules..." > $SYNOPKG_TEMP_LOGFILE
                  
                  # nvidia 모듈 로드 시도
                  if [ -d /var/packages/nvidia-driver/target/lib/modules/drivers/nvidia ]; then
                      for module in nvidia-drm nvidia-modeset nvidia; do
                          if [ -f "/var/packages/nvidia-driver/target/lib/modules/drivers/nvidia/${module}.ko" ]; then
                              insmod "/var/packages/nvidia-driver/target/lib/modules/drivers/nvidia/${module}.ko" 2>/dev/null || true
                          fi
                      done
                  fi
                  
                  # 디바이스 노드 생성
                  if [ -c /dev/nvidia0 ]; then
                      chmod 666 /dev/nvidia*
                  fi
                  
                  echo "NVIDIA driver started" >> $SYNOPKG_TEMP_LOGFILE
                  exit 0
                  ;;
              stop)
                  echo "Unloading NVIDIA kernel modules..." > $SYNOPKG_TEMP_LOGFILE
                  
                  # 역순으로 모듈 언로드
                  for module in nvidia nvidia-modeset nvidia-drm; do
                      rmmod $module 2>/dev/null || true
                  done
                  
                  echo "NVIDIA driver stopped" >> $SYNOPKG_TEMP_LOGFILE
                  exit 0
                  ;;
              status)
                  # nvidia 모듈이 로드되어 있는지 확인
                  if lsmod | grep -q nvidia; then
                      exit 0
                  else
                      exit 1
                  fi
                  ;;
          esac
          SCRIPT_EOF
          
              # postinst 스크립트
              cat > $scripts_dir/postinst << 'SCRIPT_EOF'
          #!/bin/sh
          
          # 모듈 디렉토리 생성
          mkdir -p /lib/modules/$(uname -r)/kernel/drivers/nvidia
          
          # 모듈 복사
          if [ -d ${SYNOPKG_PKGDEST}/lib/modules/drivers/nvidia ]; then
              cp ${SYNOPKG_PKGDEST}/lib/modules/drivers/nvidia/*.ko /lib/modules/$(uname -r)/kernel/drivers/nvidia/ 2>/dev/null || true
          fi
          
          # modprobe.d 설정 복사
          if [ -f ${SYNOPKG_PKGDEST}/etc/modprobe.d/nvidia.conf ]; then
              cp ${SYNOPKG_PKGDEST}/etc/modprobe.d/nvidia.conf /etc/modprobe.d/
          fi
          
          # depmod 실행
          depmod -a
          
          exit 0
          SCRIPT_EOF
          
              # preuninst 스크립트  
              cat > $scripts_dir/preuninst << 'SCRIPT_EOF'
          #!/bin/sh
          
          # NVIDIA 모듈 언로드
          for module in nvidia nvidia-modeset nvidia-drm; do
              rmmod $module 2>/dev/null || true
          done
          
          # 설치된 파일 제거
          rm -f /lib/modules/$(uname -r)/kernel/drivers/nvidia/*.ko 2>/dev/null || true
          rm -f /etc/modprobe.d/nvidia.conf 2>/dev/null || true
          
          # depmod 갱신
          depmod -a
          
          exit 0
          SCRIPT_EOF
          
              # 모든 스크립트 실행권한 부여
              chmod +x $scripts_dir/*
              
              # 최종 SPK 생성
              mkdir -p /image/packages
              pkg_make_spk ${PKG_DIR} "/image/packages" $(pkg_get_spk_family_name)
          }
          
          # 실행
          create_inner_tarball
          create_spk
          
          echo "=== NVIDIA driver package created successfully ==="
          EOF
          
          # 모든 스크립트에 실행권한 부여
          sudo chmod +x /toolkit/source/nvidia-driver/SynoBuildConf/*

      - name: Build NVIDIA package
        run: |
          cd /toolkit/pkgscripts-ng
          
          echo "=== Pre-build environment check ==="
          echo "Chroot environment:"
          sudo ls -la "/toolkit/build_env/ds.${{ matrix.arch }}-${{ matrix.dsm }}/source/"
          echo "Package source:"
          #sudo ls -la "/toolkit/source/nvidia-driver/"
          # 먼저 구조 확인
          sudo tree "/toolkit/source/nvidia-driver/" || sudo find "/toolkit/source/nvidia-driver/" | head -20
          # 그 다음 중요 파일들 내용 확인  
          sudo find "/toolkit/source/nvidia-driver/" -name "SynoBuildConf" -exec find {} -type f \; | while read f; do echo "=== $f ==="; sudo cat "$f"; echo; done
          
          # 패키지 빌드 실행
          sudo ./PkgCreate.py -p ${{ matrix.arch }} -v ${{ matrix.dsm }} -c nvidia-driver || {
            echo "=== Build failed - Detailed diagnostics ==="
            echo "Build environment contents:"
            sudo find "/toolkit/build_env/ds.${{ matrix.arch }}-${{ matrix.dsm }}/source/" -type f -name "Makefile" || true
            echo "Error log contents:"
            sudo cat "/toolkit/logs/error.build" || true
            echo "Build log contents:"  
            sudo cat "/toolkit/logs/build.log" || true
            exit 1
          }
          
      - name: Rename and prepare packages
        run: |
          cd /toolkit/result_spk
          ls -la
          
          # 생성된 패키지 찾기
          for spk_dir in */; do
            if [ -d "$spk_dir" ]; then
              cd "$spk_dir"
              ls -l *.spk
              
              # 디버그 패키지 제거
              rm -f *_debug.spk || true
              
              # 패키지명에 DSM 버전 추가
              for f in *.spk; do
                if [ -f "$f" ]; then
                  mv "$f" "${f%.spk}-${{ matrix.arch }}-${{ matrix.dsm }}.spk"
                fi
              done
              
              ls -l *.spk
              cd ..
            fi
          done
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-driver-${{ matrix.arch }}-${{ matrix.dsm }}
          path: /toolkit/result_spk/*/*.spk
          
      - name: Release packages
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            /toolkit/result_spk/*/*.spk

  create-combined-release:
    if: github.event_name == 'release'
    needs: build-nvidia-package  
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        
      - name: Create combined release info
        run: |
          echo "# NVIDIA Driver Package for Synology DSM" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "이 릴리스는 다음 플랫폼과 DSM 버전을 지원합니다:" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## 지원 플랫폼" >> RELEASE_NOTES.md
          echo "- kvmx64 (Virtual Machine, x86_64)" >> RELEASE_NOTES.md  
          echo "- geminilake (Intel Gemini Lake)" >> RELEASE_NOTES.md
          echo "- apollolake (Intel Apollo Lake)" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## 지원 DSM 버전" >> RELEASE_NOTES.md
          echo "- DSM 7.0, 7.1, 7.2" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## 설치 방법" >> RELEASE_NOTES.md
          echo "1. 해당 모델/DSM 버전에 맞는 .spk 파일 다운로드" >> RELEASE_NOTES.md
          echo "2. DSM 패키지 센터에서 수동 설치" >> RELEASE_NOTES.md
          echo "3. 패키지 시작 후 GPU 상태 확인" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## 주의사항" >> RELEASE_NOTES.md
          echo "- 이 패키지는 커뮤니티에서 개발된 비공식 패키지입니다" >> RELEASE_NOTES.md
          echo "- 설치 전 시스템 백업을 권장합니다" >> RELEASE_NOTES.md
          echo "- Synology 공식 GPU 패키지와 충돌할 수 있습니다" >> RELEASE_NOTES.md
          
      - name: Update release with notes
        uses: softprops/action-gh-release@v2  
        with:
          tag_name: ${{ github.event.release.tag_name }}
          body_path: RELEASE_NOTES.md
          files: |
            nvidia-driver-*/*.spk
